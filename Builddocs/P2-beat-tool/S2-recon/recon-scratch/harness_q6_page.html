<!doctype html><html><body>
<script>
window.__decodeAll = async (fileNames) => {
  const ctx = new (window.AudioContext||window.webkitAudioContext)();
  const results = [];
  let totalDecodeMs = 0;
  const buffers = [];
  for (const name of fileNames) {
    const resp = await fetch('kit_samples/' + name);
    const arrBuf = await resp.arrayBuffer();
    const t0 = performance.now();
    const audioBuf = await ctx.decodeAudioData(arrBuf.slice(0));
    const t1 = performance.now();
    const decodeMs = t1 - t0;
    totalDecodeMs += decodeMs;
    const memBytes = audioBuf.length * audioBuf.numberOfChannels * 4;
    buffers.push(audioBuf);
    results.push({
      file: name,
      bytesOnDisk: arrBuf.byteLength,
      decodeMs: Math.round(decodeMs*100)/100,
      decodedFrames: audioBuf.length,
      decodedSeconds: audioBuf.duration,
      decodedMemoryBytes: memBytes,
      sampleRate: audioBuf.sampleRate,
    });
  }
  window.__kitBuffers = buffers;
  return { perFile: results, totalDecodeMs: Math.round(totalDecodeMs*100)/100 };
};

window.__triggerCost = async (nTriggers) => {
  const ctx = new (window.AudioContext||window.webkitAudioContext)();
  const buffers = window.__kitBuffers;
  const t0 = performance.now();
  for (let i=0;i<nTriggers;i++) {
    const buf = buffers[i % buffers.length];
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const gain = ctx.createGain();
    src.connect(gain).connect(ctx.destination);
    src.start(ctx.currentTime);
    src.stop(ctx.currentTime + 0.001);
  }
  const t1 = performance.now();
  ctx.close();
  return { nTriggers, totalMs: Math.round((t1-t0)*1000)/1000, perTriggerMs: Math.round(((t1-t0)/nTriggers)*1000)/1000 };
};

window.__synthTriggerCost = async (nTriggers) => {
  const ctx = new (window.AudioContext||window.webkitAudioContext)();
  const t0 = performance.now();
  for (let i=0;i<nTriggers;i++) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = 110 + (i%12)*10;
    osc.connect(gain).connect(ctx.destination);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime+0.005);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.01);
  }
  const t1 = performance.now();
  ctx.close();
  return { nTriggers, totalMs: Math.round((t1-t0)*1000)/1000, perTriggerMs: Math.round(((t1-t0)/nTriggers)*1000)/1000 };
};
</script>
</body></html>
