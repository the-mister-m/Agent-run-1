<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wave Synth — Chromebook DAW</title>

<!--
  /tools/desktop/wave-synth.html — the Wave Synth standalone page, desktop.
  Twin: /tools/mobile/wave-synth.html. Same modules, different layout flag.

      python3 -m http.server 8000
      http://127.0.0.1:8000/tools/desktop/wave-synth.html

-->

<link rel="stylesheet" href="../../src/ui/tokens.css">
<style>
  html, body { margin: var(--sp-0); padding: var(--sp-0); background: var(--bg, #0a0d13); }
  .cbdaw-boot {
    margin: var(--sp-0); padding: var(--sp-12);
    font-family: var(--font-ui);
    color: var(--text, #f2f6fc); background: var(--bg, #0a0d13);
  }
  .cbdaw-boot code { color: var(--accent, #34e5b4); }
</style>
</head>
<body>

<noscript>
  <p class="cbdaw-boot">
    This tool is a Web Audio instrument and needs JavaScript enabled.
  </p>
</noscript>

<script type="module">
  import { mountStandaloneTool } from '../../src/ui/shell.js';
  import WaveSynth from '../../src/instruments/wave-synth.js';
  import Spectrum from '../../src/vis/spectrum.js';

  // One visual: the spectrum tap. The scope tap is null on this instrument.
  mountStandaloneTool({
    toolId: 'wave-synth',
    layout: 'desktop',
    Instrument: WaveSynth,
    Visual: Spectrum,
    tap: 'spectrum',
    lesson:
      'Two oscillators, one filter, two envelopes, two LFOs and a mod matrix. ' +
      'Stack voices with unison and detune them apart.',
    visualTitle: 'Spectrum analyzer',
    visualNote:
      'every frequency in the sound right now — pulse width, detune and the filter ' +
      'each move a different part of this picture',
  });
</script>

</body>
</html>
